<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailCraft — Native HTML Email Studio &amp; SMTP Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Changa+One:ital@0;1&family=Playwrite+IT+Trad:wght@100..400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0px; padding: 0px; box-sizing: border-box; background-color: #ecf0f3; font-family: 'ChangaOneLocal', 'Changa One', sans-serif; outline: none; }
    body { background-color: #ecf0f3; color: rgb(110, 115, 125); min-height: 100vh; padding: 30px 18px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; line-height: 1.6; }
    .container { max-width: 820px; width: 100%; text-align: center; margin: 0 auto; }
    h1, h2, h3, .neu-btn, .neu-badge { font-family: 'Chewy', cursive, sans-serif; font-weight: normal; }
    h1 { font-size: 2.8rem; color: rgb(60, 65, 75); margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.12), -2px -2px 4px #ffffff; line-height: 1.2; }
    h2 { font-size: 1.9rem; color: rgb(60, 65, 75); margin-bottom: 14px; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1), -1px -1px 2px #ffffff; }
    p { color: rgb(120, 125, 135); font-size: 1.05rem; margin-bottom: 18px; }
    .neu-card { background-color: #ecf0f3; padding: 35px 25px; border-radius: 30px; box-shadow: -5px -5px 12px #ffffff, 5px 5px 12px rgba(0, 0, 0, 0.16); margin-bottom: 28px; text-align: left; }
    .neu-card-center { text-align: center; }
    .neu-inset { background-color: #ecf0f3; padding: 20px; border-radius: 20px; box-shadow: inset -3px -3px 8px #ffffff, inset 3px 3px 8px rgba(0, 0, 0, 0.16); margin: 16px 0; }
    .neu-btn { display: inline-block; background-color: #ecf0f3; padding: 12px 28px; border-radius: 30px; box-shadow: -4px -4px 10px #ffffff, 4px 4px 10px rgba(0, 0, 0, 0.16); color: rgb(60, 65, 75); text-decoration: none; font-size: 1.2rem; transition: all 0.2s ease; cursor: pointer; margin: 6px; }
    .neu-btn:hover { color: rgb(30, 35, 45); }
    .neu-btn:active { box-shadow: inset -3px -3px 8px #ffffff, inset 3px 3px 8px rgba(0, 0, 0, 0.16); }
    .neu-btn-primary { color: #6d28d9; }
    .neu-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; box-shadow: -3px -3px 7px #ffffff, 3px 3px 7px rgba(0, 0, 0, 0.12); font-size: 0.95rem; color: #6d28d9; margin-bottom: 12px; }
    footer { background-color: #ecf0f3; padding: 25px 20px; border-radius: 30px; box-shadow: -5px -5px 12px #ffffff, 5px 5px 12px rgba(0, 0, 0, 0.16); width: 100%; color: rgb(120, 125, 135); font-size: 0.9rem; margin-top: 20px; text-align: center; }
    footer p, footer nav, footer nav a { font-family: 'PlaywriteLocal', 'Playwrite IT Trad', cursive, sans-serif !important; }
    footer nav { margin-top: 10px; }
    footer nav a { color: rgb(80, 85, 95); text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="neu-card neu-card-center">
      <div class="neu-badge">Version 1.1.1 Released • 2026 @dev-aemni</div>
      <h1>✉️ MailCraft</h1>
      <p>Native Android HTML Email Studio • Direct Primary Inbox SMTP Client</p>
      <div style="margin-top: 15px;">
        <a href="https://github.com/dev-aemni/Mailcraft/releases" class="neu-btn neu-btn-primary">Download APK (v1.1.1)</a>

    </div>

  </div>

</html>
